name: One-time dependency vulnerability audit
on:
  push:
    branches:
      - feat/provisio-supabase-fundacao-20261015
    paths:
      - .github/workflows/provisio-dependency-audit-once.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Summarize dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const a=require("./audit-report.json");console.log("AUDIT_SUMMARY",JSON.stringify({metadata:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,direct:v.isDirect,range:v.range,fix:v.fixAvailable})).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}))'
