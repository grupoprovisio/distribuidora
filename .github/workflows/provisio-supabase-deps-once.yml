name: One-time pin Supabase auth SDK
on:
  push:
    branches:
      - feat/provisio-supabase-fundacao-20261015
    paths:
      - .github/workflows/provisio-supabase-deps-once.yml
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install and pin official Supabase SDKs
        run: npm install @supabase/supabase-js@latest @supabase/ssr@latest --save-exact --ignore-scripts --no-fund
      - name: Validate dependency lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Commit package changes only to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(auth): pin Supabase SDK versions and lockfile"
            git push origin HEAD:feat/provisio-supabase-fundacao-20261015
          fi
