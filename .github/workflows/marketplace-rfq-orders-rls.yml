name: Provisio RFQ Orders RLS
on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'scripts/sql-test/**'
      - 'app/api/marketplace/transactions/**'
      - 'app/app/comprador/**'
      - 'app/app/fornecedor/**'
      - '.github/workflows/marketplace-rfq-orders-rls.yml'
  push:
    branches:
      - feat/provisio-avanco-dois-perfis-20261022
permissions:
  contents: read
jobs:
  postgres-rls-and-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify catalogue and RFQ/order migrations with tenant isolation
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql-test/bootstrap.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql-test/local-storage-bootstrap.sql >/dev/null
          # The initial authorization suites exercise the historical read-only grants.
          for migration in db/migrations/000[1-9]*.sql db/migrations/001[0-5]*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          for suite in \
            scripts/sql-test/marketplace-rls.sql \
            scripts/sql-test/marketplace-admin-catalog.sql \
            scripts/sql-test/marketplace-admin-commercial-write.sql \
            scripts/sql-test/marketplace-catalog-audit.sql \
            scripts/sql-test/marketplace-buyer-regions.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$suite" >/dev/null
            echo "PASS legacy suite $suite"
          done
          # The new catalogue grants change SQLSTATE semantics without weakening tenant RLS.
          for migration in db/migrations/001[6-9]*.sql db/migrations/002[0-3]*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            echo "PASS migration $migration"
          done
          for suite in scripts/sql-test/marketplace-transactional.sql scripts/sql-test/marketplace-fulfillment.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$suite" >/dev/null
            echo "PASS transactional suite $suite"
          done
