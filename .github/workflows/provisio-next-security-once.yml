name: One-time security patch Next.js
on:
  push:
    branches:
      - feat/provisio-supabase-fundacao-20261015
    paths:
      - .github/workflows/provisio-next-security-once.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Pin patched compatible Next.js and ESLint config
        run: npm install next@16.4.2 eslint-config-next@16.4.2 --save-exact --ignore-scripts --no-fund
      - name: Apply non-breaking transitive advisory fixes
        run: npm audit fix --ignore-scripts --no-fund || true
      - name: Verify pinned install
        run: npm ci --ignore-scripts --no-fund
      - name: Commit only dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch critical Next.js advisory and safe transitive packages"
            git push origin HEAD:feat/provisio-supabase-fundacao-20261015
          fi
